name: Update profile snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions: {}

concurrency:
  group: profile-snapshot-publication
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # actions/setup-python v6.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14.6"

      - name: Run generator tests
        run: python -m unittest discover -s tests -v

      - name: Generate dated public snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_activity.py --output assets/activity.svg

      - name: Publish changed snapshot
        shell: bash
        run: |
          if git diff --quiet -- assets/activity.svg; then
            echo "Snapshot is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/activity.svg
          git commit -m "chore(profile): refresh public shipping snapshot"
          git push
